<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FishPilot AI — Offline</title>
    <style>

        background: #061620;
        color: #eaf6f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;

        padding: 24px;

        width: 64px;
        height: 64px;
      }

        font-size: 1.25rem;
        margin: 0;
      }
      p {
        color: rgba(234, 246, 246, 0.65);
        max-width: 32ch;
        margin: 0;
      }
      a {
        margin-top: 8px;
        color: #061620;
        background: #ffb238;
        text-decoration: none;
        font-weight: 600;
        padding: 12px 20px;
        border-radius: 10px;
      }

  </head>
  <body>
    <div class="wrap">
      <img class="icon" src="/icons/icon-192.png" alt="" />
      <h1>Nessuna connessione</h1>
      <p>
        Segnale GPS/4G assente. Gli spot preferiti salvati restano
